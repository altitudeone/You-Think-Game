<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      max-width: 500px;
      width: 100%;
      border: 1px solid #333;
      box-sizing: border-box;
    }
    h2 { color: #fff; margin-top: 10px; font-size: 1.15rem; line-height: 1.5; }
    textarea {
      width: 100%;
      height: 100px;
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px;
      box-sizing: border-box;
      font-size: 0.95rem;
      resize: none;
      margin-top: 15px;
    }
    textarea:disabled {
      background-color: #1a1a1a;
      color: #777;
      border-color: #2a2a2a;
    }
    button {
      width: 100%;
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.2s;
    }
    button:hover { background-color: #2563eb; }
    .result-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #262626;
      border-left: 4px solid #3b82f6;
      border-radius: 4px;
      display: none;
    }
    .mic-drop {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #a1a1aa;
      font-style: italic;
      text-align: center;
      border-top: 1px solid #333;
      padding-top: 10px;
    }
    .watermark {
      margin-top: 25px;
      text-align: center;
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="caseBox">
      <small style="color: #3b82f6; font-weight: bold;" id="caseCounter">CASE</small>
      <h2 id="scenarioText">Loading case...</h2>
    </div>

    <textarea id="userAnswer" placeholder="Ketik jalan pikiranmu di sini..."></textarea>
    <button id="submitBtn" onclick="sendAnswer()">Kirim Jawaban</button>

    <div id="resultBox" class="result-box">
      <div id="aiResponseText"></div>
      <div class="mic-drop">Don't seek the answer here. See with your brain.</div>
      <button id="nextBtn" onclick="loadRandomCase()" style="background-color: #333; margin-top: 15px;">Coba Kasus Lain</button>
    </div>

    <!-- WATERMARK -->
    <div class="watermark">Crafted by : WaktuLuangProject</div>
  </div>

  <script>
    // Bank Kasus Melimpah (Gak Bakal Berasa Berulang)
    var scenarios = [
      "Bagaimana kamu menempatkan posisi dirimu saat teman terdekatmu meminjam uang dalam jumlah besar untuk modal usaha yang risikonya sangat tinggi?",
      "Bagaimana sikapmu jika rekan kerjamu mengambil alih kredit atas ide besar yang sepenuhnya kamu ciptakan?",
      ];

    var lastIndex = -1;
    var currentScenario = "";

    function loadRandomCase() {
      var randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * scenarios.length);
      } while (randomIndex === lastIndex && scenarios.length > 1);
      
      lastIndex = randomIndex;
      currentScenario = scenarios[randomIndex];
      
      document.getElementById('caseCounter').innerText = "CASE #" + (randomIndex + 1);
      document.getElementById('scenarioText').innerText = currentScenario;
      
      // Reset UI
      document.getElementById('userAnswer').value = "";
      document.getElementById('userAnswer').disabled = false;
      document.getElementById('submitBtn').style.display = "block";
      document.getElementById('submitBtn').innerText = "Kirim Jawaban";
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('resultBox').style.display = "none";
    }

    function sendAnswer() {
      var answer = document.getElementById('userAnswer').value.trim();
      if(!answer) return alert("Ketik dulu jalan pikiranmu, bro!");

      var submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = "Mencermin jalan pikiranmu...";
      submitBtn.disabled = true;

      google.script.run.withSuccessHandler(function(response) {
        document.getElementById('aiResponseText').innerText = response;
        document.getElementById('resultBox').style.display = "block";

        // Lock Input & Hide Submit
        document.getElementById('userAnswer').disabled = true;
        submitBtn.style.display = "none";

      }).processUserAnswer(currentScenario, answer);
    }

    window.onload = loadRandomCase;
  </script>

</body>
</html>
